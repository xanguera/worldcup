<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Simulator ⚽</title>
<meta name="description" content="Simulate the 48-team FIFA World Cup 2026 — group draw, knockout bracket, live matches. English / Português.">

<style>
  :root{
    --bg1:#0b2a4a; --bg3:#08324f;
    --card:#0f2f4d; --card2:#12395e;
    --line:rgba(255,255,255,.12);
    --ink:#eaf4ff; --muted:#9fbdd8;
    --gold:#ffd24a; --gold2:#ffb200;
    --green:#22c06b; --red:#ff5470; --blue:#3aa0ff;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:16px; font-size:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(58,160,255,.20), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(34,192,107,.20), transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg3) 55%,#061d33);
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:18px 16px 80px}
  h1,h2,h3{margin:0}
  button{font-family:inherit;cursor:pointer}
  .btn{border:none;border-radius:12px;padding:12px 18px;font-weight:800;font-size:1rem;
    color:#06202f;background:linear-gradient(180deg,var(--gold),var(--gold2));
    box-shadow:0 6px 0 #a97800, var(--shadow);transition:transform .06s ease, box-shadow .06s ease;}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #a97800, var(--shadow)}
  .btn.green{color:#052414;background:linear-gradient(180deg,#3ee383,#12a457);box-shadow:0 6px 0 #0a7a3c,var(--shadow)}
  .btn.green:active{box-shadow:0 3px 0 #0a7a3c,var(--shadow)}
  .btn.ghost{color:var(--ink);background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line);font-weight:700}
  .btn.ghost:active{transform:translateY(2px)}
  .btn.small{padding:7px 12px;font-size:.85rem;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .btn.small:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}

  header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .logo{display:flex;align-items:center;gap:12px}
  .logo .ball{font-size:2.2rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));animation:spin 8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .logo h1{font-size:1.5rem;letter-spacing:.3px;line-height:1}
  .logo .sub{color:var(--gold);font-weight:800;font-size:.8rem;letter-spacing:2px}
  .top .spacer{flex:1}
  .tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:5px;flex-wrap:wrap}
  .tab{border:none;background:transparent;color:var(--muted);font-weight:800;padding:9px 13px;border-radius:9px;font-size:.88rem}
  .tab.active{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#06202f}
  .tab:disabled{opacity:.35;cursor:not-allowed}

  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}

  /* Home */
  .hero{text-align:center;padding:40px 22px}
  .hero .big{font-size:clamp(2rem,6vw,3.6rem);font-weight:900;line-height:1.02;
    background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);max-width:640px;margin:14px auto 0;font-size:1.05rem}
  .hostrow{display:flex;gap:16px;justify-content:center;align-items:center;margin:22px 0 8px;flex-wrap:wrap}
  .hostrow img{height:34px;border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
  .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
  .facts{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:30px;color:var(--muted)}
  .facts b{display:block;font-size:1.8rem;color:var(--gold);font-weight:900}
  .facts div{text-align:center;font-size:.82rem;letter-spacing:.5px;text-transform:uppercase}
  .favpick{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:26px;
    background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:520px;margin-left:auto;margin-right:auto}
  .favpick img{height:26px;border-radius:4px}
  select{font-family:inherit;font-size:.95rem;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0a2a44;color:var(--ink);font-weight:700}
  .resume-note{color:var(--muted);font-size:.85rem;margin-top:14px}

  /* toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar .spacer{flex:1}

  /* Groups */
  .grid-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .group h3{display:flex;align-items:center;gap:8px;font-size:1.05rem;margin-bottom:10px}
  .group h3 .badge{background:var(--gold);color:#06202f;font-weight:900;border-radius:8px;padding:2px 10px;font-size:.9rem}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{padding:6px 6px;text-align:center}
  th{color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}
  td.team{text-align:left;font-weight:700;cursor:pointer}
  td.team:hover{color:var(--gold)}
  td.team img{height:16px;width:24px;object-fit:cover;border-radius:3px;vertical-align:middle;margin-right:8px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
  tr.q1 td{background:rgba(34,192,107,.16)}
  tr.q2 td{background:rgba(58,160,255,.14)}
  tr.q3 td{background:rgba(255,210,74,.10)}
  tr.fav td{box-shadow:inset 3px 0 0 var(--gold)}
  td.pts{font-weight:900;color:var(--gold)}
  .fixtures{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .fx{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.9rem}
  .fx .side{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
  .fx .side.b{flex-direction:row-reverse;text-align:right}
  .fx .side img{height:15px;width:22px;object-fit:cover;border-radius:3px;flex:none}
  .fx .side span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx .sc{font-weight:900;min-width:52px;text-align:center;background:rgba(0,0,0,.3);border-radius:8px;padding:3px 0}
  .fx .sc.todo{color:var(--muted);font-weight:700}
  .fx .actions{display:flex;gap:5px;flex:none}
  .legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.8rem;margin-top:6px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .thirds td.pos{color:var(--gold);font-weight:900}

  /* Bracket */
  .zoom-controls{display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:5px}
  .zoom-controls button{width:34px;height:34px;border:none;border-radius:8px;background:rgba(255,255,255,.08);color:var(--ink);font-weight:900;font-size:1.15rem;display:flex;align-items:center;justify-content:center;line-height:1}
  .zoom-controls button:active{background:rgba(255,255,255,.2)}
  .zoom-controls .zlabel{min-width:42px;text-align:center;font-weight:800;font-size:.8rem;color:var(--muted)}
  .zoom-controls .fitbtn{width:auto;padding:0 10px;font-size:.8rem;font-weight:800}
  .bracket-zoom-wrap{overflow:auto;touch-action:none;-webkit-overflow-scrolling:touch;border-radius:12px;position:relative;cursor:grab;max-height:75vh}
  .bracket-zoom-wrap.grabbing{cursor:grabbing}
  .bracket{display:flex;gap:26px;padding:8px 2px 20px;width:max-content;transform-origin:0 0}
  .round{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:220px}
  .round-title{text-align:center;color:var(--gold);font-weight:900;letter-spacing:1px;text-transform:uppercase;font-size:.78rem;margin-bottom:6px}
  .tie{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px}
  .tie .row{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:8px}
  .tie .row.win{background:rgba(34,192,107,.20)}
  .tie .row.lose{opacity:.5}
  .tie .row img{height:15px;width:22px;object-fit:cover;border-radius:3px;flex:none}
  .tie .row .nm{flex:1;font-weight:700;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .tie .row .g{font-weight:900;min-width:16px;text-align:center}
  .tie .row .pen{font-size:.7rem;color:var(--gold);margin-left:2px}
  .tie .note{text-align:center;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:1px}
  .tie .tbtns{display:flex;gap:5px;margin-top:3px}
  .tie.tbd{opacity:.45}

  /* Teams grid + detail */
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tcard{cursor:pointer;text-align:center;padding:14px 10px;position:relative;transition:transform .08s}
  .tcard:hover{transform:translateY(-3px)}
  .tcard img{height:34px;width:51px;object-fit:cover;border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,.5)}
  .tcard .nm{font-weight:800;font-size:.9rem;margin-top:8px;line-height:1.15}
  .tcard .ov{display:inline-block;margin-top:6px;background:var(--gold);color:#06202f;font-weight:900;border-radius:8px;padding:1px 9px;font-size:.85rem}
  .tcard .star{position:absolute;top:8px;right:10px;font-size:1rem}
  .searchbar{width:100%;max-width:360px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#0a2a44;color:var(--ink);font-size:.95rem;font-weight:600}

  .detail-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .detail-head img{height:70px;width:105px;object-fit:cover;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.25)}
  .detail-head .ov-big{font-size:2.6rem;font-weight:900;color:var(--gold);line-height:1}
  .sliders{margin-top:20px;display:grid;gap:16px;max-width:520px}
  .slider-row label{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px;font-size:.92rem}
  .slider-row label b{color:var(--gold)}
  input[type=range]{width:100%;accent-color:var(--gold);height:6px}
  .roster{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-weight:700;font-size:.85rem;display:flex;gap:8px;align-items:center}
  .chip .no{background:var(--gold);color:#06202f;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900}

  /* Stats */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .tile{padding:16px;text-align:center}
  .tile b{display:block;font-size:1.9rem;color:var(--gold);font-weight:900;line-height:1.1}
  .tile span{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.5px}
  .tile small{display:block;color:var(--ink);font-weight:700;margin-top:4px;font-size:.9rem}

  /* Match overlay */
  .overlay{position:fixed;inset:0;background:rgba(3,12,22,.92);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
  .overlay.show{display:flex}
  .match{width:min(720px,100%);background:linear-gradient(180deg,#0e3a30,#0a2740);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
  .match .pitch{background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 40px, transparent 40px 80px),linear-gradient(180deg,#127a4a,#0c5a37);padding:20px 18px;position:relative}
  .stage-label{position:absolute;top:10px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:.72rem}
  .scoreboard{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}
  .side-big{flex:1;text-align:center;max-width:220px}
  .side-big img{height:64px;width:96px;object-fit:cover;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.3)}
  .side-big .nm{font-weight:900;margin-top:8px;font-size:1rem}
  .side-big .rk{color:rgba(255,255,255,.6);font-size:.72rem}
  .side-big .favtag{color:var(--gold);font-weight:900;font-size:.72rem}
  .score{font-size:3.2rem;font-weight:900;min-width:150px;text-align:center;text-shadow:0 3px 10px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:14px}
  .score .flash{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6);color:var(--gold)}100%{transform:scale(1)}}
  .commentary{text-align:center;font-style:italic;color:#eafff2;min-height:1.4em;margin-top:12px;font-weight:600;opacity:0;transition:opacity .25s}
  .commentary.show{opacity:1}
  .clock{text-align:center;margin-top:8px}
  .clock .time{display:inline-block;background:rgba(0,0,0,.45);color:#fff;font-weight:900;padding:4px 14px;border-radius:20px;font-size:1.05rem;letter-spacing:1px}
  .clock .bar{height:6px;background:rgba(0,0,0,.35);border-radius:6px;margin:10px auto 0;max-width:420px;overflow:hidden}
  .clock .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fff);border-radius:6px;transition:width .15s linear}
  .feed{background:#08283f;max-height:180px;overflow-y:auto;padding:12px 16px;margin:0;list-style:none}
  .feed li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.9rem;animation:slidein .35s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  .feed .m{background:var(--gold);color:#06202f;font-weight:900;border-radius:6px;padding:1px 7px;font-size:.78rem;min-width:34px;text-align:center}
  .feed .who{font-weight:700}.feed .who small{color:var(--muted);font-weight:600}
  .feed .goalicon{font-size:1.1rem}
  .feed .pen-head{color:var(--gold);font-weight:900;letter-spacing:1px;text-transform:uppercase;font-size:.75rem;border:none}
  .match .controls{display:flex;gap:10px;align-items:center;padding:12px 16px;background:#0a2135}
  .match .controls .spacer{flex:1}
  .seg{display:flex;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:none;background:transparent;color:var(--muted);font-weight:800;padding:8px 12px;font-size:.82rem}
  .seg button.on{background:var(--gold);color:#06202f}
  .langsw{align-self:center}
  .langsw button{padding:8px 11px;font-size:.8rem}

  /* Match report */
  .report{padding:20px 18px}
  .report-head{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:16px}
  .rh-team{flex:1;text-align:center;font-weight:800;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:6px}
  .rh-team img{height:38px;width:58px;object-fit:cover;border-radius:6px;border:2px solid rgba(255,255,255,.25)}
  .rh-score{font-size:1.9rem;font-weight:900;text-align:center;min-width:90px}
  .rh-tag{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .motm-card{background:linear-gradient(135deg,rgba(255,210,74,.18),rgba(255,210,74,.03));border:1px solid rgba(255,210,74,.4);border-radius:14px;padding:12px 14px;margin-bottom:16px}
  .motm-badge{color:var(--gold);font-weight:900;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .motm-body{display:flex;align-items:center;gap:12px}
  .motm-body img{height:32px;width:48px;object-fit:cover;border-radius:6px;border:2px solid rgba(255,255,255,.25)}
  .motm-name{font-weight:900;font-size:1.02rem}
  .motm-sub{color:var(--muted);font-size:.78rem;font-weight:700}
  .motm-rating{margin-left:auto;background:var(--gold);color:#06202f;font-weight:900;border-radius:10px;padding:6px 12px;font-size:1rem}
  .report-stats{display:flex;flex-direction:column;gap:10px}
  .stat-row{display:flex;align-items:center;gap:10px}
  .stat-val{font-weight:900;min-width:24px;text-align:center;font-size:.85rem}
  .stat-mid{flex:1}
  .stat-label{text-align:center;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .stat-bar{display:flex;height:7px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.08)}
  .stat-bar i{display:block;height:100%;background:var(--gold)}
  .stat-bar i.a{background:rgba(255,255,255,.35)}

  /* Champion */
  .champ{text-align:center;padding:36px 20px}
  .trophy{font-size:5rem;filter:drop-shadow(0 8px 20px rgba(255,210,74,.5));animation:float 2.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .champ img{height:110px;width:165px;object-fit:cover;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5);border:3px solid var(--gold);margin:16px 0}
  .champ .name{font-size:2.4rem;font-weight:900;background:linear-gradient(90deg,var(--gold),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .champ .tag{color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-weight:800}
  .champ .favwin{color:var(--gold);font-weight:900;font-size:1.15rem;margin-top:10px;animation:pop 1s ease}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:80;display:none}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid var(--line);padding:10px 18px;border-radius:12px;font-weight:700;z-index:70;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:520px){
    .score{font-size:2.4rem;min-width:110px}
    .side-big img{height:48px;width:72px}
  }
  @media (prefers-reduced-motion: reduce){
    .ball,.trophy{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">
      <div class="ball">⚽</div>
      <div><div class="sub">FIFA</div><h1 id="brandTitle">World Cup 2026 <span style="color:var(--gold)">Simulator</span></h1></div>
    </div>
    <div class="spacer"></div>
    <div class="seg langsw" id="langsw">
      <button data-lang="en" class="on">EN</button><button data-lang="pt">PT</button>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-screen="home">Home</button>
      <button class="tab" data-screen="teams">Teams</button>
      <button class="tab" data-screen="groups" id="tab-groups" disabled>Groups</button>
      <button class="tab" data-screen="knockout" id="tab-knockout" disabled>Knockout</button>
      <button class="tab" data-screen="stats" id="tab-stats" disabled>Stats</button>
    </nav>
  </header>
  <main id="app"></main>
</div>

<div class="overlay" id="overlay"><div class="match" id="match"></div></div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================================
   FIFA World Cup 2026 Simulator — single file, no server, no dependencies
   (flags from flagcdn.com). Quality-based match engine + save/resume.
   ========================================================================== */

/* ---------------------------------------------------------------------------
   1. TEAM DATA
--------------------------------------------------------------------------- */
const HOSTS = ["USA","Mexico","Canada"];
const TEAMS = [
  {name:"Argentina",   code:"ar",     rating:92, players:["Messi","J. Álvarez","L. Martínez","E. Fernández","Mac Allister"]},
  {name:"France",      code:"fr",     rating:91, players:["Mbappé","Griezmann","Dembélé","Tchouaméni","Thuram"]},
  {name:"Spain",       code:"es",     rating:90, players:["Lamine Yamal","Pedri","Nico Williams","Morata","Olmo"]},
  {name:"England",     code:"gb-eng", rating:89, players:["Bellingham","Kane","Saka","Foden","Palmer"]},
  {name:"Brazil",      code:"br",     rating:88, players:["Vini Jr","Rodrygo","Raphinha","Endrick","Paquetá"]},
  {name:"Portugal",    code:"pt",     rating:87, players:["Ronaldo","B. Fernandes","B. Silva","L. Leão","J. Félix"]},

/* ---------------------------------------------------------------------------
   3. QUALITIES  (attack / midfield / defense / goalkeeping -> overall)
--------------------------------------------------------------------------- */
const QW = {a:0.35, m:0.20, d:0.30, g:0.15};                    // overall weights
const clampQ = v=>Math.max(35,Math.min(99,Math.round(v)));
function ovRaw(a,m,d,g){return QW.a*a+QW.m*m+QW.d*d+QW.g*g;}
function overall(q){return Math.round(ovRaw(q.attack,q.midfield,q.defense,q.goalkeeping));}
function baseQualities(t){
  const s=STYLE[t.name]||{};
  let a=t.rating+(s.a||0)+noise(t.name,1);
  let m=t.rating+(s.m||0)+noise(t.name,2);
  let d=t.rating+(s.d||0)+noise(t.name,3);
  let g=t.rating+(s.g||0)+noise(t.name,4);
  const delta=t.rating-ovRaw(a,m,d,g); a+=delta; m+=delta; d+=delta; g+=delta;   // normalize Overall≈rating
  return {attack:clampQ(a),midfield:clampQ(m),defense:clampQ(d),goalkeeping:clampQ(g)};
}
function Q(name){return state.qualities[name];}                 // current (editable) qualities

  return {screen:"home", groups:null, knockout:null, soundOn:true, speed:"fast", lang:"en",

function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!s||!s.qualities||!s.stats) return null;
    // heal: ensure every team has qualities (data may have changed since save)
    TEAMS.forEach(t=>{
      if(!s.qualities[t.name]) s.qualities[t.name]=baseQualities(t);
      else if(s.qualities[t.name].goalkeeping==null) s.qualities[t.name].goalkeeping=baseQualities(t).goalkeeping;
    });
    if(!("favTeam" in s)) s.favTeam="";
    if(s.lang!=="pt" && s.lang!=="en") s.lang="en";
    return s;
  }catch(e){ return null; }
}

/* ---------------------------------------------------------------------------
   5. DRAW
--------------------------------------------------------------------------- */
function drawGroups(){
  const hosts = HOSTS.map(byName);
  const rest  = TEAMS.filter(t=>!HOSTS.includes(t.name)).sort((a,b)=>b.rating-a.rating);
  const pots  = [shuffle([...hosts,...rest.slice(0,9)]), shuffle(rest.slice(9,21)),
                 shuffle(rest.slice(21,33)), shuffle(rest.slice(33,45))];
  const groups = GROUP_LETTERS.map(L=>({letter:L, teams:[], fixtures:[], done:false}));
  pots.forEach(pot=>pot.forEach((team,i)=>groups[i].teams.push(team.name)));
  groups.forEach(g=>{ g.teams=shuffle(g.teams); g.fixtures=makeFixtures(g.teams); });
  return groups;
}
function makeFixtures(teams){
  const [a,b,c,d]=teams;
  const rounds=[[[a,b],[c,d]],[[a,c],[d,b]],[[a,d],[b,c]]];
  const fx=[];
  rounds.forEach((r,ri)=>r.forEach(([h,aw])=>fx.push({home:h,away:aw,day:ri+1,played:false,result:null})));
  return fx;
}

/* ---------------------------------------------------------------------------
   6. MATCH ENGINE (quality-based; attack vs defense)
--------------------------------------------------------------------------- */
const GOAL_BASE=1.32, KGOAL=0.019;
function attDef(q){return {att:0.62*q.attack+0.38*q.midfield, def:0.5*q.defense+0.3*q.midfield+0.2*q.goalkeeping};}
function xgOf(att,def){return Math.max(0.22,Math.min(3.3, GOAL_BASE*Math.exp(KGOAL*(att-def))));}
function minuteLabel(m){ if(m===90 && rand()<0.5) return {label:"90+"+(1+randInt(4)),raw:90}; return {label:String(m),raw:m}; }
function goalEvent(m,team,side){ const L=minuteLabel(m); return {minute:L.label,raw:L.raw,team,side,scorer:scorer(team)}; }

function simulateMatch(homeName,awayName){
  const H=attDef(Q(homeName)), A=attDef(Q(awayName));
  const xgH=xgOf(H.att,A.def)*(0.82+rand()*0.38);
  const xgA=xgOf(A.att,H.def)*(0.82+rand()*0.38);
  const events=[]; let gh=0,ga=0;
  const pH=xgH/90, pA=xgA/90;
  for(let m=1;m<=90;m++){
    if(rand()<pH){gh++; events.push(goalEvent(m,homeName,"home"));}
    if(rand()<pA){ga++; events.push(goalEvent(m,awayName,"away"));}
  }
  // extra time (only used if a knockout tie is level) — reduced scoring rate
  const etEvents=[]; let etH=0,etA=0;
  const pEtH=(xgH*0.30)/30, pEtA=(xgA*0.30)/30;
  for(let m=91;m<=120;m++){
    if(rand()<pEtH){etH++; etEvents.push({minute:String(m),raw:m,team:homeName,side:"home",scorer:scorer(homeName)});}
    if(rand()<pEtA){etA++; etEvents.push({minute:String(m),raw:m,team:awayName,side:"away",scorer:scorer(awayName)});}
  }
  return {home:homeName,away:awayName,gh,ga,events,etH,etA,etEvents};
}

function shootout(homeName,awayName){
  const H=Q(homeName), A=Q(awayName);
  const clamp=p=>Math.max(0.5,Math.min(0.92,p));
  // each kicker's success depends on their team's overall composure vs the opposing goalkeeper
  const pH=0.78+(overall(H)-A.goalkeeping)/500, pA=0.78+(overall(A)-H.goalkeeping)/500;
  const kicks=[]; let sh=0,sa=0;
  for(let i=1;i<=5;i++){
    const okH=rand()<clamp(pH); if(okH)sh++; kicks.push({team:homeName,i,scored:okH});
    const okA=rand()<clamp(pA); if(okA)sa++; kicks.push({team:awayName,i,scored:okA});
  }
  let sd=6;
  while(sh===sa){
    const okH=rand()<clamp(pH); if(okH)sh++; kicks.push({team:homeName,i:sd,scored:okH,sd:true});
    const okA=rand()<clamp(pA); if(okA)sa++; kicks.push({team:awayName,i:sd,scored:okA,sd:true});
    if(++sd>15){ if(rand()<0.5)sh++; else sa++; }
  }
  return {sh,sa,kicks,winner: sh>sa?homeName:awayName};
}

/* Post-match report: realistic-looking team stats + Man of the Match, generated from team qualities. */
function generateMatchStats(homeName,awayName,gh,ga){
  const H=Q(homeName), A=Q(awayName);
  let possH=Math.round(50+(H.midfield-A.midfield)/3+(rand()*10-5));
  possH=Math.max(32,Math.min(68,possH));
  const shotsFor=(attack,goals)=>Math.max(goals+1, Math.round(attack/9+goals*1.8+rand()*4));
  const shH=shotsFor(H.attack,gh), shA=shotsFor(A.attack,ga);
  const sotFor=(shots,goals)=>Math.min(shots, goals+randInt(3)+1);
  const corFor=(shots)=>Math.max(1,Math.round(shots/2.4+rand()*2));
  const foulsFor=()=>6+randInt(8);
  const foulsH=foulsFor(), foulsA=foulsFor();
  const cardsFor=(fouls)=>({yellow:Math.min(3,Math.round(fouls/7*rand()*2)), red: rand()<0.04?1:0});
  const cardsH=cardsFor(foulsH), cardsA=cardsFor(foulsA);
  return {
    possession:{home:possH,away:100-possH},
    shots:{home:shH,away:shA},
    onTarget:{home:sotFor(shH,gh),away:sotFor(shA,ga)},
    corners:{home:corFor(shH),away:corFor(shA)},
    fouls:{home:foulsH,away:foulsA},
    yellow:{home:cardsH.yellow,away:cardsA.yellow},
    red:{home:cardsH.red,away:cardsA.red},
  };
}
function pickMotm(homeName,awayName,gh,ga,goalEvents,winner){
  const tallies={};
  (goalEvents||[]).forEach(ev=>{ const k=ev.team+"|"+ev.scorer; tallies[k]=(tallies[k]||0)+1; });
  const candidates=Object.keys(tallies).map(k=>{
    const [team,player]=k.split("|"); const goals=tallies[k];
    let score=6.9+goals*1.05+rand()*0.6;
    if(team===winner) score+=0.3;
    return {team,player,goals,score};
  });
  [homeName,awayName].forEach(team=>{
    const star=players(team)[0], key=team+"|"+star;
    if(!tallies[key]){
      let score=6.1+(overall(Q(team))-70)/40+rand()*0.7;
      if(team===winner) score+=0.3;
      if((team===homeName&&ga===0)||(team===awayName&&gh===0)) score+=0.5;
      candidates.push({team,player:star,goals:0,score});
    }
  });
  candidates.sort((a,b)=>b.score-a.score);
  const top=candidates[0];
  top.score=Math.max(6.0,Math.min(9.9,top.score));
  return top;
}
function matchWinner(homeName,awayName,gh,ga,so){
  if(gh>ga) return homeName; if(ga>gh) return awayName; return so?so.winner:null;
}
function statBar(labelText,hVal,aVal,isPct){
  const hPct = isPct?hVal:Math.round(hVal/((hVal+aVal)||1)*100);

}

/* Play a full match for a context; returns final result + the goal events that counted. */
function playFull(home,away,knockout){
  const r=simulateMatch(home,away);
  let gh=r.gh, ga=r.ga, decidedBy="normal", so=null, counted=r.events.slice();
  if(knockout && gh===ga){
    gh+=r.etH; ga+=r.etA; decidedBy="aet"; counted=counted.concat(r.etEvents);
    if(gh===ga){ so=shootout(home,away); decidedBy="pens"; }
  }
  const result={gh,ga};
  if(knockout){ result.decidedBy=decidedBy; if(so) result.shootout=so; }
  return {result,counted};
}

/* ---------------------------------------------------------------------------
   7. STATS
--------------------------------------------------------------------------- */
function recordStats(home,away,gh,ga,goalEvents){
  const st=state.stats;
  st.matches++; st.goals+=gh+ga;
  const T=n=>st.teams[n]||(st.teams[n]={P:0,W:0,D:0,L:0,GF:0,GA:0});
  const th=T(home), ta=T(away);
  th.P++; ta.P++; th.GF+=gh; th.GA+=ga; ta.GF+=ga; ta.GA+=gh;
  if(gh>ga){th.W++;ta.L++;} else if(ga>gh){ta.W++;th.L++;} else {th.D++;ta.D++;}
  (goalEvents||[]).forEach(ev=>{ const k=ev.team+"|"+ev.scorer; st.scorers[k]=(st.scorers[k]||0)+1; });
  const diff=Math.abs(gh-ga), tot=gh+ga;
  if(diff>0 && (!st.biggestWin||diff>st.biggestWin.diff)){
    st.biggestWin = gh>ga ? {winner:home,loser:away,gf:gh,ga,diff} : {winner:away,loser:home,gf:ga,ga:gh,diff};
  }
  if(!st.mostGoals||tot>st.mostGoals.total){ st.mostGoals={home,away,gh,ga,total:tot}; }
}

/* ---------------------------------------------------------------------------
   8. STANDINGS / QUALIFICATION / BRACKET
--------------------------------------------------------------------------- */
function computeStandings(group){
  const rows={};
  group.teams.forEach(t=>rows[t]={team:t,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0});
  group.fixtures.forEach(fx=>{
    if(!fx.played)return;
    const {home,away,result}=fx, {gh,ga}=result;
    const rh=rows[home], rr=rows[away];
    rh.P++;rr.P++;rh.GF+=gh;rh.GA+=ga;rr.GF+=ga;rr.GA+=gh;
    if(gh>ga){rh.W++;rr.L++;rh.Pts+=3;} else if(gh<ga){rr.W++;rh.L++;rr.Pts+=3;} else {rh.D++;rr.D++;rh.Pts++;rr.Pts++;}
  });
  const arr=Object.values(rows); arr.forEach(r=>r.GD=r.GF-r.GA);
  return sortTable(arr);
}
function sortTable(arr){return arr.sort((a,b)=> b.Pts-a.Pts || b.GD-a.GD || b.GF-a.GF || a.team.localeCompare(b.team));}
function groupDone(g){return g.fixtures.every(f=>f.played);}
function allGroupsDone(){return state.groups.every(groupDone);}

function qualifiers(){
  const winners=[],runners=[],thirds=[];
  state.groups.forEach(g=>{
    const s=computeStandings(g);
    winners.push({...s[0],grp:g.letter}); runners.push({...s[1],grp:g.letter}); thirds.push({...s[2],grp:g.letter});
  });
  const bestThirds=sortTable(thirds).slice(0,8);
  return [...sortTable(winners),...sortTable(runners),...sortTable(bestThirds)].map(r=>r.team);
}
function standardSeeds(n){
  let seeds=[1];
  while(seeds.length<n){ const round=seeds.length*2+1, next=[]; for(const s of seeds){next.push(s);next.push(round-s);} seeds=next; }
  return seeds;
}
function makeTie(a,b){return {home:a,away:b,played:false,result:null,winner:null,loser:null};}
function buildKnockout(){
  const seeded=qualifiers(), order=standardSeeds(32), bt=order.map(s=>seeded[s-1]);
  const r32=[]; for(let i=0;i<bt.length;i+=2) r32.push(makeTie(bt[i],bt[i+1]));
  return {rounds:[r32], thirdPlace:null, champion:null};
}
function roundName(idx,total){
  const teams=Math.pow(2,total-idx);
  return (L().rounds&&L().rounds[teams]) || I18N.en.rounds[teams] || `Round ${idx+1}`;
}
function recordKnockout(tie,result){
  tie.played=true; tie.result=result;
  const {gh,ga}=result;
  if(gh>ga || (result.shootout && result.shootout.winner===tie.home)){ tie.winner=tie.home; tie.loser=tie.away; }
  else { tie.winner=tie.away; tie.loser=tie.home; }
  progressBracket();
}
function progressBracket(){
  const k=state.knockout, cur=k.rounds[k.rounds.length-1];
  if(!cur.every(t=>t.played)) return;
  if(cur.length===1){
    k.champion=cur[0].winner;
    if(k.rounds.length>=2){
      const semis=k.rounds[k.rounds.length-2];
      if(semis.length===2 && !k.thirdPlace) k.thirdPlace=makeTie(semis[0].loser,semis[1].loser);
    }
    return;
  }
  const next=[]; for(let i=0;i<cur.length;i+=2) next.push(makeTie(cur[i].winner,cur[i+1].winner));
  k.rounds.push(next);
}

/* ----- Bracket zoom/pan (mobile pinch, buttons, wheel, drag) ----- */
let bracketZoom = null;
const ZOOM_MIN=0.35, ZOOM_MAX=2.2, ZOOM_STEP=0.2;
function applyBracketZoom(){
  const b=$("#bracket"); if(!b) return;
  b.style.transform=`scale(${bracketZoom})`;
  const lbl=$("#zoomLabel"); if(lbl) lbl.textContent=Math.round(bracketZoom*100)+"%";
}
function setBracketZoom(z,cx,cy){
  const wrap=$("#bracketWrap"); if(!wrap) return;
  const oldZoom=bracketZoom||1;
  const newZoom=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,z));
  if(cx!=null && cy!=null){
    const rect=wrap.getBoundingClientRect();
    const px=(wrap.scrollLeft+cx-rect.left)/oldZoom;
    const py=(wrap.scrollTop+cy-rect.top)/oldZoom;
    bracketZoom=newZoom; applyBracketZoom();
    wrap.scrollLeft=px*newZoom-(cx-rect.left);
    wrap.scrollTop=py*newZoom-(cy-rect.top);
  } else {
    bracketZoom=newZoom; applyBracketZoom();
  }
}
function zoomBracketBy(delta){
  const wrap=$("#bracketWrap"); if(!wrap) return;
  const rect=wrap.getBoundingClientRect();
  setBracketZoom((bracketZoom||1)+delta, rect.left+rect.width/2, rect.top+rect.height/2);
}
function fitBracketToScreen(){
  const wrap=$("#bracketWrap"), b=$("#bracket"); if(!wrap||!b) return;
  b.style.transform="scale(1)";
  const naturalW=b.scrollWidth;
  const availW=wrap.clientWidth-4;
  const fit=naturalW>0 ? Math.min(1,availW/naturalW) : 1;
  bracketZoom=Math.max(ZOOM_MIN,fit);
  applyBracketZoom();
  wrap.scrollLeft=0; wrap.scrollTop=0;
}
function touchDist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
function touchMid(t){return {x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2};}
function setupBracketGestures(){
  const wrap=$("#bracketWrap"); if(!wrap) return;
  let pinchDist=null, pinchStartZoom=1, panStart=null;
  wrap.addEventListener("touchstart",e=>{
    if(e.touches.length===2){ pinchDist=touchDist(e.touches); pinchStartZoom=bracketZoom||1; panStart=null; }
    else if(e.touches.length===1){ panStart={x:e.touches[0].clientX+wrap.scrollLeft,y:e.touches[0].clientY+wrap.scrollTop}; }
  },{passive:true});
  wrap.addEventListener("touchmove",e=>{
    if(e.touches.length===2 && pinchDist){
      e.preventDefault();
      const d=touchDist(e.touches), mid=touchMid(e.touches);
      setBracketZoom(pinchStartZoom*(d/pinchDist), mid.x, mid.y);
    } else if(e.touches.length===1 && panStart){
      e.preventDefault();
      wrap.scrollLeft=panStart.x-e.touches[0].clientX;
      wrap.scrollTop=panStart.y-e.touches[0].clientY;
    }
  },{passive:false});
  wrap.addEventListener("touchend",e=>{
    if(e.touches.length<2) pinchDist=null;
    if(e.touches.length===0) panStart=null;
  });
  wrap.addEventListener("wheel",e=>{
    if(!(e.ctrlKey||e.metaKey)) return;
    e.preventDefault();
    setBracketZoom((bracketZoom||1)*(1-e.deltaY*0.01), e.clientX, e.clientY);
  },{passive:false});
  wrap.addEventListener("mousedown",e=>{
    if(e.button!==0) return;
    wrap.classList.add("grabbing");
    const start={x:e.clientX+wrap.scrollLeft,y:e.clientY+wrap.scrollTop};
    const onMove=e2=>{ wrap.scrollLeft=start.x-e2.clientX; wrap.scrollTop=start.y-e2.clientY; };
    const onUp=()=>{ wrap.classList.remove("grabbing"); document.removeEventListener("mousemove",onMove); document.removeEventListener("mouseup",onUp); };
    document.addEventListener("mousemove",onMove);
    document.addEventListener("mouseup",onUp);
  });
}

  let minute=0, gh=0, ga=0, endMinute=90, inET=false, decidedBy="normal", finished=false;
  const evByMin={}, etByMin={};
  sim.events.forEach(ev=>{(evByMin[ev.raw]=evByMin[ev.raw]||[]).push(ev);});
  sim.etEvents.forEach(ev=>{(etByMin[ev.raw]=etByMin[ev.raw]||[]).push(ev);});

  function revealGoal(ev,silent){
    if(ev.side==="home")gh++; else ga++;
    $("#sh").textContent=gh; $("#sa").textContent=ga;
    const scEl = ev.side==="home"?$("#sh"):$("#sa");
    scEl.classList.remove("flash"); void scEl.offsetWidth; scEl.classList.add("flash");
    const li=el("li"); li.innerHTML=`<span class="m">${ev.minute}'</span><span class="goalicon">⚽</span><span class="who">${ev.scorer} <small>(${teamName(ev.team)})</small></span>`;

      setCommentary(pick(L().commGoal).split("{s}").join(ev.scorer).split("{t}").join(teamName(ev.team)));
      if(state.soundOn) beep(ev.side==="home"?520:440,.14);
      burstConfetti(ev.team===state.favTeam?420:160);

  function updateClock(){ $("#clock").textContent=minute+"'"; $("#prog").style.width=(Math.min(minute,endMinute)/endMinute*100)+"%"; }
  function enterET(){ inET=true; decidedBy="aet"; endMinute=120;
    feedEl.appendChild(el("li","",`<span class="pen-head">${t("et_break",{gh,ga})}</span>`));
    setCommentary(t("et_comm")); }

  function finalize(){
    if(finished) return; finished=true;
    clearInterval(liveTimer); liveTimer=null;
    const result={gh,ga};
    if(knockout){
      if(gh===ga){ const so=shootout(home,away); result.shootout=so; decidedBy="pens";
        feedEl.appendChild(el("li","",`<span class="pen-head">${t("pens_head")}</span>`));
        so.kicks.forEach(k=>{ const li=el("li");
          li.innerHTML=`<span class="m">PK</span><span class="who">${teamName(k.team)} ${k.scored?t("pk_scored"):t("pk_missed")}</span><small style="color:var(--muted);margin-left:auto">${k.sd?t("sudden"):t("kick",{i:k.i})}</small>`;
          feedEl.appendChild(li); });
        feedEl.appendChild(el("li","",`<span class="pen-head">${t("pens_win",{w:teamName(so.winner),sh:so.sh,sa:so.sa})}</span>`));
        feedEl.scrollTop=feedEl.scrollHeight;
        setCommentary(t("pens_comm",{w:teamName(so.winner)}));
      }
      result.decidedBy=decidedBy;
    }
    $("#clock").textContent = decidedBy==="pens"?t("pens_s"):decidedBy==="aet"?t("aet_s"):t("ft");
    $("#prog").style.width="100%";
    const counted = inET ? sim.events.concat(sim.etEvents) : sim.events;
    const skip=$("#skipBtn"); skip.textContent=t("view_report"); skip.className="btn small green";
    skip.onclick=()=>showReport(result,counted);
    burstConfetti(900);
  }
  function showReport(result,counted){
    const winner=matchWinner(home,away,result.gh,result.ga,result.shootout);
    const stats=generateMatchStats(home,away,result.gh,result.ga);
    const mvp=pickMotm(home,away,result.gh,result.ga,counted,winner);
    box.innerHTML=matchReportHTML(home,away,result.gh,result.ga,result.decidedBy,result.shootout,stats,mvp);
    $("#reportContinue").onclick=()=>{ ov.classList.remove("show"); onFinish(result,counted); };
  }
  function step(){
    minute++; updateClock();
    const bucket = minute<=90?evByMin[minute]:etByMin[minute];
    let scored=false;
    (bucket||[]).forEach(ev=>{ revealGoal(ev,false); scored=true; });
    if(!scored && rand()<0.06) setCommentary(pick(L().commFiller));
    if(minute===90 && !(knockout && gh===ga)) return finalize();
    if(minute===90 && knockout && gh===ga) return enterET();
    if(minute>=endMinute) return finalize();
  }
  clearInterval(liveTimer); liveTimer=setInterval(step,speedMs());

  $("#skipBtn").onclick=()=>{
    clearInterval(liveTimer); liveTimer=null;
    for(let mm=minute+1;mm<=90;mm++) (evByMin[mm]||[]).forEach(ev=>revealGoal(ev,true));
    minute=90;
    if(knockout && gh===ga){ inET=true; decidedBy="aet"; for(let mm=91;mm<=120;mm++) (etByMin[mm]||[]).forEach(ev=>revealGoal(ev,true)); minute=120; }
    finalize();
  };
}

/* ---------------------------------------------------------------------------
   11. SOUND + CONFETTI
--------------------------------------------------------------------------- */
let audioCtx=null;
function beep(freq,dur){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="triangle"; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,audioCtx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur+0.02);
  }catch(e){}
}
const confetti=$("#confetti"), cctx=confetti.getContext("2d");
let confParticles=[], confRAF=null;
function sizeCanvas(){confetti.width=innerWidth;confetti.height=innerHeight;}
addEventListener("resize",sizeCanvas); sizeCanvas();
const COLORS=["#ffd24a","#ff5470","#3aa0ff","#22c06b","#ffffff","#ff9f1c"];
const reduceMotion = matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function burstConfetti(count){
  if(reduceMotion) return;
  confetti.style.display="block";
  for(let i=0;i<count/10;i++){
    confParticles.push({x:innerWidth/2+(rand()-.5)*innerWidth*0.6,y:innerHeight*0.3,
      vx:(rand()-.5)*8,vy:rand()*-8-3,g:0.25+rand()*0.15,size:5+rand()*7,
      color:COLORS[randInt(COLORS.length)],rot:rand()*6.28,vr:(rand()-.5)*0.4,life:60+randInt(50)});
  }
  if(!confRAF) confLoop();
}
function celebrate(){
  let bursts=0; const iv=setInterval(()=>{ burstConfetti(1400); if(++bursts>6)clearInterval(iv); },350);
  if(state.soundOn) [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*160));
}
function confLoop(){
  cctx.clearRect(0,0,confetti.width,confetti.height);
  confParticles.forEach(p=>{ p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;
    cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.rot);cctx.fillStyle=p.color;cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);cctx.restore();});
  confParticles=confParticles.filter(p=>p.life>0 && p.y<confetti.height+40);
  if(confParticles.length) confRAF=requestAnimationFrame(confLoop);
  else{ confRAF=null; cctx.clearRect(0,0,confetti.width,confetti.height); confetti.style.display="none"; }
}

/* ---------------------------------------------------------------------------
   12. EVENTS + BOOT
--------------------------------------------------------------------------- */
$$("#tabs .tab").forEach(b=>b.onclick=()=>{ if(!b.disabled) setScreen(b.dataset.screen); });
$$("#langsw button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
/* delegated: click any team name/card to open its detail */
$("#app").addEventListener("click",e=>{
  const t=e.target.closest("[data-team]"); if(!t) return;
  const btn=e.target.closest("button"); if(btn) return;   // don't hijack Play/Quick
  state.viewTeam=t.dataset.team; setScreen("teamDetail");
});
/* delegated buttons that appear/disappear (champion banner) */
$("#app").addEventListener("click",e=>{
  if(e.target.id==="playAgain") newTournament();
  else if(e.target.id==="seeStats") setScreen("stats");
});

const saved=load();
state = saved ? Object.assign(newState(),saved) : newState();
render();
